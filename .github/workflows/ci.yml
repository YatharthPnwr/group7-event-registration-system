name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-reports
          path: |
            reports/junit.xml
            coverage/
          if-no-files-found: warn

  build:
    name: Database migrations and production build
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: events
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d events"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/events?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/events?schema=public
      AUTH_SECRET: ci-only-secret-not-used-in-production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply migrations to a fresh database
        run: npx prisma migrate deploy
      - name: Integration tests against Postgres
        run: npm run test:integration
      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: integration-test-reports
          path: reports/junit-integration.xml
          if-no-files-found: warn
      - run: npm run build

  e2e:
    name: Selenium end-to-end tests
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: events
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d events"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/events?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/events?schema=public
      AUTH_SECRET: ci-only-secret-not-used-in-production
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      MAIL_FROM: Event Registration <no-reply@events.local>
      SEED_ADMIN_EMAIL: admin@events.local
      SEED_ADMIN_PASSWORD: admin-demo-123
      BASE_URL: http://localhost:3000
      MAILPIT_URL: http://localhost:8025
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare the database
        run: |
          npx prisma migrate deploy
          npx prisma db seed
      - run: npm run build
      - name: Start the app
        run: npm start > app.log 2>&1 &
      - name: Wait for the app to answer
        run: |
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/health && exit 0; sleep 1; done
          cat app.log; exit 1
      - name: Selenium tests in headless Chrome
        run: npm run test:e2e
      - name: Upload Selenium report and failure screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: selenium-report
          path: reports/e2e/
          if-no-files-found: warn
